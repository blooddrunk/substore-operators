# Sub-Store 保热脚本配置模板（keepwarm.sh 读取）。
# 复制为 keepwarm.conf 并填入真实值——keepwarm.conf 含订阅地址，
# 已被 .gitignore 排除，不要提交。
#
# BASE：下载地址前缀 https://<后端域名>/<路径标识>/download
# CACHE_DIR：反代缓存目录（宿主机路径），供 uninstall --purge-cache 清空；
#   1Panel openresty 部署通常为 /opt/1panel/www/cache/substore（对应
#   openresty-substore-cache.conf 容器内的 /www/cache/substore）。可留空。
# 其余每行一个需要保热的下载路径（相对 BASE，无需引号或转义）；以 http://
# 或 https:// 开头的行按完整 URL 处理，不拼 BASE。
# 路径列表必须覆盖客户端定时拉取的每一个下载 URL——不同 $options 变体是
# 独立的缓存 key，需逐行列出。增删订阅后直接改这里：已安装的 conf 改完下次
# 运行即生效，仓库 conf 改完重新执行 install 覆盖安装。

BASE=https://substore.example.com/PATH_TOKEN/download
CACHE_DIR=/opt/1panel/www/cache/substore

collection/MyCollection?$options=filterType%3Dreality%26profile%3Dmain
collection/MyCollection?$options=filterType%3Dhy2
my-sub-1
my-sub-2
