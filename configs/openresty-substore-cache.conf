# Sub-Store 下载缓存 —— 1Panel/openresty 实际部署版
#
# 背景：daed（dae-wing）更新订阅时单次尝试硬编码 5 秒超时且不可配置。
# Sub-Store 冷生产（探测缓存过期 + HTTP META 启动延迟 + 死节点探测超时）
# 经常超过 5 秒，导致 daed 更新失败：
#   "context deadline exceeded (Client.Timeout exceeded while awaiting headers) (direct); ... (route)"
#
# 本配置在 openresty 层做 proxy_cache：预热后所有下载请求毫秒级响应
# （stale-while-revalidate），上游慢或瞬时 500 不再传导给 daed。
#
# 实际部署位置（VPS 203.0.113.10，1Panel openresty 容器为 host 网络）：
#   ① 本文件第一段（proxy_cache_path）→ /opt/1panel/www/conf.d/substore-cache.conf
#      （挂载到容器 /usr/local/openresty/nginx/conf/conf.d/，被 nginx.conf 的
#        http{} include 加载）
#   ② 本文件第二段（location）→ /opt/1panel/www/sites/substore.example.com/proxy/download.conf
#      （被站点 server{} 的 include /www/sites/<域名>/proxy/*.conf 加载，
#        最长前缀优先级高于原有 root.conf 的 `location ^~ /`）
#
# 缓存目录放在 /www/cache（宿主机 /opt/1panel/www/cache/substore），
# 随 1Panel 的 /opt/1panel/www 数据卷持久化，openresty 容器被 watchtower
# 重建后缓存仍在，目录也不会缺失导致 nginx 启动失败。
#
# 生效与验证：
#   docker exec openresty-container nginx -t
#   docker exec openresty-container nginx -s reload
#   curl -sI 'https://substore.example.com/PATH_TOKEN/download/bwh' | grep -i x-cache-status
#   # MISS（首次，可能 5~6s）→ 之后 HIT（约 30ms）

# ─── ① http{} 级别：/opt/1panel/www/conf.d/substore-cache.conf ───────────────
proxy_cache_path /www/cache/substore levels=1:2
                 keys_zone=substore_cache:10m max_size=64m inactive=7d
                 use_temp_path=off;

# ─── ② 站点 server{} 级别：/opt/1panel/www/sites/substore.example.com/proxy/download.conf ───
location ^~ /PATH_TOKEN/download/ {
    proxy_pass http://127.0.0.1:48238;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    proxy_cache substore_cache;
    # 不同 $options 变体（reality / hy2 / profile=main ...）各自独立缓存。
    proxy_cache_key "$scheme$proxy_host$request_uri";
    proxy_cache_valid 200 10m;

    # 收拢 daed 定时任务的并发抓取（所有订阅同为 10 */6 * * *）。
    proxy_cache_lock on;
    proxy_cache_lock_timeout 60s;
    proxy_cache_lock_age 120s;

    # 过期后先回旧值、后台刷新；上游慢/瞬时 500 永不透传给 daed。
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    add_header X-Cache-Status $upstream_cache_status always;
}
