# OpenResty/nginx caching front for the Sub-Store download endpoints.
#
# Why: daed (dae-wing) fetches subscriptions with a HARD-CODED 5s timeout per
# attempt (direct, then routed) and no configuration knob. A cold Sub-Store
# production (probe cache expired, HTTP META start delay, dead-node probe
# timeouts) regularly exceeds 5s, so daed update fails with:
#   "context deadline exceeded (Client.Timeout exceeded while awaiting headers)"
#
# This cache answers every download request from disk/memory once warmed:
# expired entries are served stale while refreshed in the background, and
# upstream 5xx/timeout never reaches daed after the first good copy.
#
# Deploy:
#   1. proxy_cache_path goes in the http {} block (e.g. nginx.conf).
#   2. The location block goes in the server {} for substore.example.com.
#   3. Replace SUBSTORE_UPSTREAM with your backend, e.g. http://127.0.0.1:3001.
#   4. mkdir -p /var/cache/nginx/substore && nginx -t && nginx -s reload
#   5. Prime once per URL with curl (or use the keep-warm cron in configs/README.md).

# --- http {} level -----------------------------------------------------------
proxy_cache_path /var/cache/nginx/substore levels=1:2
                 keys_zone=substore_cache:10m max_size=64m inactive=7d
                 use_temp_path=off;

# --- inside server {} for substore.example.com -------------------------------
location ^~ /PATH_TOKEN/download/ {
    proxy_pass http://SUBSTORE_UPSTREAM;

    proxy_cache substore_cache;
    # $options query variants (reality / hy2 / profile=main ...) cache separately.
    proxy_cache_key "$scheme$proxy_host$request_uri";
    proxy_cache_valid 200 10m;

    # Collapse the daed cron stampede (all subscriptions fetch at 10 */6 * * *).
    proxy_cache_lock on;
    proxy_cache_lock_timeout 60s;
    proxy_cache_lock_age 120s;

    # Serve stale while a background refresh runs; never fail through to daed.
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # Origin cold productions can take ~30-60s; that must NOT hit the client.
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    add_header X-Cache-Status $upstream_cache_status always;
}
